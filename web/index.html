<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>fxs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231d1d1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <button type="button" id="project" class="project" title="Folder">
      <span id="project-name"></span>
    </button>
    <div class="actions">
      <button type="button" id="new-btn" class="icon" aria-label="New chat" title="New chat">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" id="files-btn" class="icon" aria-label="Files" title="Files" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="2.5" y="2.5" width="11" height="11" rx="2.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.25 3v10" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </button>
      <button type="button" id="more" class="icon" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="6" cy="4.5" r="1.4" fill="currentColor"/>
          <circle cx="10.25" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="7.25" cy="11.5" r="1.4" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="stage">
    <div id="blank" class="blank">
      <p>Ask this folder</p>
    </div>
    <main id="thread" class="thread"></main>
  </div>

  <footer class="dock">
    <div id="palette" class="palette" hidden>
      <ul id="palette-list" role="listbox"></ul>
    </div>
    <form id="composer" class="composer">
      <textarea id="prompt" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send" aria-label="Message"></textarea>
      <button type="submit" class="send idle" aria-label="Send" id="send">
        <svg class="i-up" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 12.5V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="i-stop" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="4.5" y="4.5" width="7" height="7" rx="1.2" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </footer>

  <div id="veil" class="veil" hidden></div>

  <aside id="files" class="files" hidden>
    <div class="files-view">
      <div id="files-stack" class="files-stack">
        <section class="pane" id="explorer" aria-label="Files">
          <header class="pane-bar">
            <span class="pane-title">Files</span>
            <input id="tree-q" type="search" placeholder="Filter" autocomplete="off" spellcheck="false" aria-label="Filter files">
            <button type="button" id="files-close" class="icon files-close" aria-label="Close files" title="Close">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </header>
          <div id="tree" class="tree" role="tree"></div>
        </section>
        <section class="pane" id="editor" aria-label="Editor">
          <header class="pane-bar">
            <button type="button" id="ed-back" class="icon" aria-label="Back to files" title="Files">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M10 3.5 4.5 8 10 12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="ed-name" class="pane-title ed-name" title="Copy path"></button>
            <span id="ed-dot" class="ed-dot" hidden></span>
            <button type="button" id="ed-wrap" class="icon quiet" aria-label="Wrap" title="Wrap">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3 4.5h10M3 8h7.5a2.5 2.5 0 0 1 0 5H7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                <path d="M8.5 11.5 7 13.5 8.5 15.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" id="ed-save" class="text-btn" hidden>Save</button>
          </header>
          <div id="ed-code" class="ed-code">
            <pre id="ed-gutter" class="ed-gutter" aria-hidden="true">1</pre>
            <textarea id="ed-body" class="ed-body" spellcheck="false" wrap="off" aria-label="File contents"></textarea>
          </div>
          <div id="ed-preview" class="ed-preview" hidden>
            <img id="ed-img" alt="">
          </div>
          <div id="ed-note" class="ed-note" hidden></div>
          <footer class="ed-status">
            <span id="ed-loc"></span>
            <span id="ed-meta"></span>
          </footer>
        </section>
      </div>
    </div>
  </aside>

  <dialog id="settings" class="sheet">
    <div class="sheet-head">
      <h2>Settings</h2>
      <button type="button" class="icon" id="settings-close" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <section class="group">
      <label class="cell stack">
        <span class="cell-k">Folder</span>
        <input id="folder-input" type="text" spellcheck="false" placeholder="/path/to/project" autocomplete="off">
      </label>
      <button type="button" class="cell" id="model-row">
        <span class="cell-k">Model</span>
        <span class="cell-v" id="model-val">GLM 5.2</span>
      </button>
      <ul id="model-list" class="pick" hidden></ul>
      <div class="cell">
        <span class="cell-k">Permissions</span>
        <div class="seg" id="perm-seg" role="radiogroup" aria-label="Permissions">
          <button type="button" data-perm="ask">Ask</button>
          <button type="button" data-perm="auto">Auto</button>
          <button type="button" data-perm="yolo">Yolo</button>
        </div>
      </div>
      <div class="cell">
        <span class="cell-k">Appearance</span>
        <div class="seg" id="theme-seg" role="radiogroup" aria-label="Appearance">
          <button type="button" data-theme="system">System</button>
          <button type="button" data-theme="light">Light</button>
          <button type="button" data-theme="dark">Dark</button>
        </div>
      </div>
      <div class="cell">
        <span class="cell-k">Agent</span>
        <span class="cell-v" id="agent-val"></span>
      </div>
    </section>

    <section class="group">
      <h3>Sessions</h3>
      <ul id="session-list"></ul>
    </section>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
