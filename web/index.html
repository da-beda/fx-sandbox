<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>fxs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231d1d1f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <button type="button" id="project" class="project" title="Workspace">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2.5 4.5h4l1 1.5h6v7.5h-11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
      <span id="project-name">project</span>
    </button>
    <p id="meta" class="meta"></p>
    <button type="button" id="model-btn" class="chip" title="Model">glm-5.2</button>
    <button type="button" id="perm-btn" class="chip" title="Permission mode">yolo</button>
    <button type="button" id="theme-btn" class="icon" aria-label="Theme" title="Theme">
      <svg class="i-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="2.4" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.2 3.2l1 1M11.8 11.8l1 1M3.2 12.8l1-1M11.8 4.2l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <svg class="i-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.2 10.2A5.4 5.4 0 0 1 5.8 2.8 5.5 5.5 0 1 0 13.2 10.2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </button>
    <button type="button" id="sessions-btn" class="icon" aria-label="Sessions" title="Sessions">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 5v3.2L10.2 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <main id="thread" class="thread"></main>

  <footer class="dock">
    <p id="activity" class="activity" hidden></p>
    <div id="palette" class="palette" hidden>
      <ul id="palette-list" role="listbox"></ul>
    </div>
    <form id="composer" class="composer">
      <textarea id="prompt" rows="1" placeholder="Ask  ·  /  ·  @" autocomplete="off" enterkeyhint="send"></textarea>
      <button type="submit" class="send" aria-label="Send" id="send">
        <svg class="i-up" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 12.5V3.5M8 3.5 3.5 8M8 3.5 12.5 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="i-stop" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="4.5" y="4.5" width="7" height="7" rx="1.2" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </footer>

  <dialog id="folder-dlg" class="sheet">
    <form method="dialog" id="folder-form">
      <h2>Folder</h2>
      <input id="folder-input" type="text" spellcheck="false" placeholder="/path/to/project">
      <div class="row">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="ok" class="solid">Open</button>
      </div>
    </form>
  </dialog>

  <dialog id="sessions-dlg" class="sheet">
    <form method="dialog">
      <h2>Sessions</h2>
      <ul id="session-list"></ul>
      <div class="row">
        <button value="new" class="ghost" id="new-session">New</button>
        <button value="close" class="solid">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="models-dlg" class="sheet">
    <form method="dialog">
      <h2>Model</h2>
      <ul id="model-list"></ul>
      <div class="row">
        <button value="close" class="solid">Done</button>
      </div>
    </form>
  </dialog>

  <dialog id="info-dlg" class="sheet">
    <form method="dialog">
      <h2 id="info-title">Status</h2>
      <pre id="info-body" class="info"></pre>
      <div class="row">
        <button value="close" class="solid">Done</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
