<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>fxs</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <button type="button" id="files-btn" class="icon" aria-label="Files" title="Files">files</button>
    <button type="button" id="project" class="project" title="Workspace"><span id="project-name">project</span></button>
    <p id="meta" class="meta"></p>
    <button type="button" id="model-btn" class="chip slim" title="Model">glm-5.2</button>
    <button type="button" id="perm-btn" class="chip" title="Permission mode">yolo</button>
    <button type="button" id="theme-btn" class="icon" aria-label="Theme" title="Theme">theme</button>
    <button type="button" id="new-btn" class="icon" aria-label="New" title="New">new</button>
    <button type="button" id="sessions-btn" class="icon" aria-label="Sessions" title="Sessions">sessions</button>
  </header>
  <div class="stage">
    <aside id="tree" class="tree" hidden>
      <div class="pane-head"><span>Files</span>
        <input id="tree-q" type="search" placeholder="Filter" spellcheck="false" autocomplete="off">
      </div>
      <nav id="tree-list" class="tree-list"></nav>
    </aside>
    <section class="chat">
      <main id="thread" class="thread"></main>
      <footer class="dock">
        <p id="activity" class="activity" hidden></p>
        <div id="palette" class="palette" hidden><ul id="palette-list" role="listbox"></ul></div>
        <form id="composer" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message  ·  @ files  ·  / commands" autocomplete="off" enterkeyhint="send"></textarea>
          <button type="submit" class="send" aria-label="Send" id="send">send</button>
        </form>
      </footer>
    </section>
    <aside id="editor" class="editor" hidden>
      <div class="pane-head">
        <span id="ed-name" class="ed-name">file</span>
        <span id="ed-dirty" class="ed-dirty" hidden></span>
        <button type="button" id="ed-save" class="chip" hidden>Save</button>
        <button type="button" id="ed-close" class="icon" aria-label="Close" title="Close">close</button>
      </div>
      <textarea id="ed-body" spellcheck="false" autocomplete="off" wrap="off" hidden></textarea>
      <div id="ed-preview" class="ed-preview" hidden></div>
      <p id="ed-note" class="ed-note" hidden></p>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
