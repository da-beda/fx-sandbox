name: apply-named-tool-choice

on:
  pull_request:
    branches: [gateway/responses-fidelity]
    paths:
      - "extras/gateway/tool_choice_fidelity.py"
      - "extras/gateway/test_tool_choice_fidelity.py"
      - "tools/apply_named_tool_choice.py"
      - ".github/workflows/apply-named-tool-choice.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'gateway/named-tool-choice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gateway/named-tool-choice
          fetch-depth: 0
      - name: Apply focused integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/apply_named_tool_choice.py
      - name: Verify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 extras/gateway/test_tool_choice_fidelity.py
          python3 extras/gateway/test_responses_fidelity.py
          python3 extras/gateway/test_fidelity_matrix.py
          python3 extras/gateway/test_gateway.py
          python3 extras/gateway/test_search_policy.py
          python3 extras/gateway/test_native_fx.py
          python3 extras/ui/test_server.py
          git diff --check
      - name: Commit transformed sources
        run: |
          set -euo pipefail
          rm tools/apply_named_tool_choice.py
          rm .github/workflows/apply-named-tool-choice.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+da-beda@users.noreply.github.com
          git add -A
          git commit -m "feat: preserve named tool choices across OpenAI transports"
          git push origin HEAD:gateway/named-tool-choice
