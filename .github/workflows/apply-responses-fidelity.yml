name: apply-responses-fidelity

on:
  pull_request:
    branches: [gateway/fidelity-matrix]
    paths:
      - "extras/gateway/responses_fidelity.py"
      - "extras/gateway/test_responses_fidelity.py"
      - "tools/apply_responses_fidelity.py"
      - ".github/workflows/apply-responses-fidelity.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'gateway/responses-fidelity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gateway/responses-fidelity
          fetch-depth: 0
      - name: Apply focused integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/apply_responses_fidelity.py
      - name: Verify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 extras/gateway/test_responses_fidelity.py
          python3 extras/gateway/test_fidelity_matrix.py
          python3 extras/gateway/test_gateway.py
          python3 extras/gateway/test_search_policy.py
          python3 extras/gateway/test_native_fx.py
          python3 extras/ui/test_server.py
          git diff --check
      - name: Commit transformed sources
        run: |
          set -euo pipefail
          rm tools/apply_responses_fidelity.py
          rm .github/workflows/apply-responses-fidelity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: preserve Responses image and structured-output semantics"
          git push origin HEAD:gateway/responses-fidelity
