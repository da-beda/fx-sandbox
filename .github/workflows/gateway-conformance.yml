name: gateway-conformance

on:
  push:
    paths:
      - "extras/gateway/**"
      - "extras/ui/**"
      - ".github/workflows/gateway-conformance.yml"
  pull_request:
    paths:
      - "extras/gateway/**"
      - "extras/ui/**"
      - ".github/workflows/gateway-conformance.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Versions
        run: python3 --version
      - name: Gateway unit tests
        run: python3 extras/gateway/test_gateway.py
      - name: Gateway search policy tests
        run: python3 extras/gateway/test_search_policy.py
      - name: Search HTTP limit tests
        run: python3 extras/gateway/test_search_http_limits.py
      - name: Responses fidelity tests
        run: python3 extras/gateway/test_responses_fidelity.py
      - name: Named tool-choice fidelity tests
        run: python3 extras/gateway/test_tool_choice_fidelity.py
      - name: Stream cancellation unit tests
        run: python3 extras/gateway/test_stream_cancel.py
      - name: Stream cancellation proxy integration
        run: python3 extras/gateway/test_stream_cancel_integration.py
      - name: Stream resource-limit tests
        run: python3 extras/gateway/test_stream_limits.py
      - name: HTTP body-limit unit tests
        run: python3 extras/gateway/test_http_limits.py
      - name: HTTP body-limit proxy integration
        run: python3 extras/gateway/test_http_limits_integration.py
      - name: Protocol fidelity matrix
        run: python3 extras/gateway/test_fidelity_matrix.py
      - name: Native provider probe tests
        run: python3 extras/gateway/test_native_fx.py
      - name: WebUI backend tests
        run: python3 extras/ui/test_server.py

  fx-stable:
    name: Current stable fx through adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install current stable fx
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/fx-bin"
          mkdir -p "$install_dir"
          curl -fsSL https://fx.sh/setup.sh | FX_INSTALL_DIR="$install_dir" bash
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/fx" --version
      - name: Probe native OpenAI-compatible transport
        run: python3 extras/gateway/native_fx.py --json --probe-transport --timeout 15
      - name: Run real-fx adapter conformance
        run: python3 extras/gateway/test_fx_conformance.py
