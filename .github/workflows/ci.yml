name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n fxs install.sh setup-fx.sh tests/*.sh
      - name: Tests
        run: bash tests/run.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build/refresh reference image through fxs
        env:
          FXS_IMAGE: fxs-ci
          FXS_DOCKERFILE: ${{ github.workspace }}/Dockerfile
        run: ./fxs --build-image --verbose
      - name: Exercise current stable fx through the real wrapper
        env:
          FXS_IMAGE: fxs-ci
          FXS_STATE_ROOT: ${{ runner.temp }}/fxs-state
        run: |
          ./fxs -- --version
          ./fxs -- --help > /tmp/fx-help.txt
          test -s /tmp/fx-help.txt
