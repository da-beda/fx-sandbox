name: apply-gateway-search-policy

on:
  pull_request:
    branches: [gateway/provider-policy]
    paths:
      - "extras/gateway/search_policy.py"
      - "extras/gateway/test_search_policy.py"
      - "tools/apply_gateway_search_policy.py"
      - ".github/workflows/apply-gateway-search-policy.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'gateway/search-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gateway/search-policy
          fetch-depth: 0
      - name: Apply focused integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/apply_gateway_search_policy.py
      - name: Verify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 extras/gateway/test_search_policy.py
          python3 extras/gateway/test_gateway.py
          python3 extras/gateway/test_native_fx.py
          python3 extras/ui/test_server.py
          git diff --check
      - name: Commit transformed sources
        run: |
          set -euo pipefail
          rm tools/apply_gateway_search_policy.py
          rm .github/workflows/apply-gateway-search-policy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: resolve Gateway search worker from live catalog"
          git push origin HEAD:gateway/search-policy
