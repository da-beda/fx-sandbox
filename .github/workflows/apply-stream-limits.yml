name: apply-stream-limits

on:
  pull_request:
    branches: [gateway/stream-cancellation]
    paths:
      - "extras/gateway/stream_limits.py"
      - "extras/gateway/test_stream_limits.py"
      - "tools/apply_stream_limits.py"
      - ".github/workflows/apply-stream-limits.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'gateway/stream-limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gateway/stream-limits
          fetch-depth: 0
      - name: Apply focused integration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/apply_stream_limits.py
      - name: Verify
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 extras/gateway/test_stream_limits.py
          python3 extras/gateway/test_stream_cancel.py
          python3 extras/gateway/test_stream_cancel_integration.py
          python3 extras/gateway/test_gateway.py
          python3 extras/gateway/test_search_policy.py
          python3 extras/gateway/test_responses_fidelity.py
          python3 extras/gateway/test_tool_choice_fidelity.py
          python3 extras/gateway/test_fidelity_matrix.py
          python3 extras/gateway/test_native_fx.py
          python3 extras/ui/test_server.py
          git diff --check
      - name: Commit transformed sources
        run: |
          set -euo pipefail
          rm tools/apply_stream_limits.py
          rm .github/workflows/apply-stream-limits.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+da-beda@users.noreply.github.com
          git add -A
          git commit -m "fix: bound untrusted upstream stream state"
          git push origin HEAD:gateway/stream-limits
